<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compass – Profile card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&amp;family=Poppins:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2974cd}a:hover{color:#6d2cbf}
</style>
</helmet>
<div style="width: 480px; height: 760px; box-sizing: border-box; padding: 40px; background: #ffffff; color: #303030; font-family: 'Open Sans', 'Helvetica Neue', Helvetica, sans-serif; display: flex; align-items: flex-start; justify-content: center">
<article style="width: 400px; box-sizing: border-box; padding: 32px; border: 1px solid #e6e6e6; border-radius: 16px; background: #ffffff; box-shadow: 0 8px 32px rgba(48, 48, 48, 0.08); display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<div role="img" aria-label="Profile photo" style="width: 112px; height: 112px; border-radius: 50%; background: #ede6f7; border: 3px solid #ffffff; box-shadow: 0 0 0 2px #6d2cbf; display: flex; align-items: center; justify-content: center; overflow: hidden">
<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6d2cbf" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-family: 'Poppins', 'Open Sans', Helvetica, sans-serif; font-size: 24px; line-height: 32px; font-weight: 600; color: #303030">[Full name]</h2>
<div style="font-size: 15px; font-weight: 600; color: #6d2cbf">[Job role]</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; color: #6e6e6e">
<div style="display: flex; align-items: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6e6e6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
<span>[City]</span>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6e6e6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
<a href="mailto:" style="color: #2974cd">[name@company.com]</a>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #e6e6e6; padding-top: 20px">
<h3 style="margin: 0; font-family: 'Poppins', 'Open Sans', Helvetica, sans-serif; font-size: 16px; font-weight: 600; color: #303030">Expertise</h3>
<p style="margin: 0; font-size: 15px; line-height: 24px; color: #6e6e6e">[Two or three sentences summarising this person’s expertise: their skills, specialisms and the kind of work they are known for.]</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #e6e6e6; padding-top: 20px">
<h3 style="margin: 0; font-family: 'Poppins', 'Open Sans', Helvetica, sans-serif; font-size: 16px; font-weight: 600; color: #303030">Projects</h3>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<li style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 14px; border-radius: 10px; background: #e5eef9; font-size: 14px; font-weight: 600; color: #303030"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #2974cd; flex-shrink: 0"></span>[Project name]</li>
<li style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 14px; border-radius: 10px; background: #e5eef9; font-size: 14px; font-weight: 600; color: #303030"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #2974cd; flex-shrink: 0"></span>[Project name]</li>
<li style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 14px; border-radius: 10px; background: #e5eef9; font-size: 14px; font-weight: 600; color: #303030"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #2974cd; flex-shrink: 0"></span>[Project name]</li>
</ul>
</div>
</article>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":760}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
