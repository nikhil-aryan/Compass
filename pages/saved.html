<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compass – Saved</title>
<!-- COM-57 Saved tab. Design: Claude Design "App - Saved".
     Saved people are stored in this browser only (localStorage key "compass.saved"),
     because there are no accounts yet. Profiles come from GET /api/people. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap">
<style>
  :root {
    --blue: #2974cd; --purple: #6d2cbf; --text: #303030; --muted: #6e6e6e;
    --line: #e6e6e6; --sky: #e5eef9; --sky-line: #d4e3f5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--text); font-family: 'Open Sans', 'Helvetica Neue', Helvetica, sans-serif; }
  a { color: var(--blue); } a:hover { color: var(--purple); }
  :focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; border-radius: 6px; }

  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 248px; flex-shrink: 0; border-right: 1px solid var(--line); padding: 32px 16px; display: flex; flex-direction: column; justify-content: space-between; }
  .sidebar .label { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin: 0 12px 12px; }
  .sidebar ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .sidebar a { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: var(--text); text-decoration: none; font-size: 15px; }
  .sidebar a[aria-current="page"] { background: var(--sky); font-weight: 600; }
  .sidebar a:hover { background: #f3f0f8; color: var(--text); }
  .sidebar svg { flex-shrink: 0; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sidebar a[aria-current="page"] svg { stroke: var(--blue); }
  .sidebar .settings { border-top: 1px solid var(--line); padding-top: 16px; }

  main { flex: 1; min-width: 0; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 24px; }
  h1 { margin: 0; font-family: 'Poppins', 'Open Sans', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600; }
  .sub { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  .note { margin: 0; font-size: 12px; color: var(--muted); }

  .cards { display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch; }
  .card { flex: 1 1 300px; min-width: 0; max-width: 420px; padding: 20px; border: 1px solid var(--sky-line); border-radius: 16px; background: #fff; box-shadow: 0 6px 24px rgba(48,48,48,.07); display: flex; flex-direction: column; gap: 16px; }
  .who { display: flex; align-items: center; gap: 14px; }
  .avatar { width: 64px; height: 64px; flex-shrink: 0; border-radius: 50%; background: var(--sky); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--blue); display: flex; align-items: center; justify-content: center; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 20px; color: var(--blue); }
  .who-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .who h2 { margin: 0; font-family: 'Poppins', 'Open Sans', sans-serif; font-size: 18px; line-height: 26px; font-weight: 600; }
  .role { font-size: 14px; font-weight: 600; color: var(--blue); }
  .city { font-size: 13px; color: var(--muted); }
  .unsave { width: 40px; height: 40px; flex-shrink: 0; margin-left: auto; align-self: flex-start; padding: 0; border: none; border-radius: 10px; background: var(--sky-line); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 150ms ease; }
  .unsave:hover { transform: scale(1.05); }
  .block h3 { margin: 0 0 4px; font-family: 'Poppins', 'Open Sans', sans-serif; font-size: 14px; font-weight: 600; }
  .block p { margin: 0; font-size: 14px; line-height: 22px; color: var(--muted); }
  .chips { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips li { display: inline-flex; align-items: center; min-height: 28px; padding: 3px 10px; border-radius: 8px; background: var(--sky); font-size: 13px; font-weight: 600; }

  .empty { max-width: 520px; padding: 28px; border: 1px dashed var(--sky-line); border-radius: 16px; background: #fafcff; }
  .empty h2 { margin: 0 0 6px; font-family: 'Poppins', 'Open Sans', sans-serif; font-size: 18px; font-weight: 600; }
  .empty p { margin: 0 0 16px; font-size: 14px; line-height: 22px; color: var(--muted); }
  .btn-link { display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 10px; background: var(--sky-line); color: var(--text); font-weight: 600; font-size: 15px; text-decoration: none; }
  .btn-link:hover { color: var(--text); background: #c4d8f0; }
  .msg { padding: 16px 20px; border-radius: 12px; background: #fff6e5; border: 1px solid #f0d9a8; font-size: 14px; }

  @media (prefers-reduced-motion: reduce) { .unsave { transition: none; } }
  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .sidebar { width: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 12px 16px; }
    .sidebar .label, .sidebar .settings-link { display: none; }
    .sidebar .settings { border-top: none; padding-top: 4px; }
    .sidebar ul { flex-direction: row; flex-wrap: wrap; }
    main { padding: 20px 16px 40px; }
    .card { max-width: none; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" aria-label="Main">
    <div>
      <p class="label">MENU</p>
      <ul>
        <li><a href="home.html"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>Home</a></li>
        <li><a href="people.html"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"></path><path d="M16 4a4 4 0 0 1 0 8"></path><path d="M22 21c0-3-1.8-5.6-4.5-6.6"></path></svg>People</a></li>
        <li><a href="saved.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Saved</a></li>
      </ul>
    </div>
    <ul class="settings"><li class="settings-link"><a href="#"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>Settings</a></li>
      <li><a href="login.html" class="account"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="10" r="3"></circle><path d="M6.2 18.4a7 7 0 0 1 11.6 0"></path></svg><span>Sign in</span></a></li>
    </ul>
  </nav>

  <main>
    <div>
      <h1>Saved</h1>
      <p class="sub" id="count" aria-live="polite">Profiles you saved</p>
    </div>
    <div id="content"><p>Loading…</p></div>
    <p class="note">Saved in this browser only. Accounts come later.</p>
  </main>
</div>

<script>
(function () {
  "use strict";
  var KEY = "compass.saved"; // same key as the save button on the result cards

  function readSaved() {
    try { var v = JSON.parse(localStorage.getItem(KEY) || "[]"); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  function writeSaved(ids) {
    try { localStorage.setItem(KEY, JSON.stringify(ids)); } catch (e) { /* storage blocked: ignore */ }
  }

  var content = document.getElementById("content");
  var count = document.getElementById("count");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text; // textContent = no HTML injection
    return e;
  }
  function initials(name) {
    return (name || "?").split(/\s+/).map(function (w) { return w[0]; }).slice(0, 2).join("").toUpperCase();
  }
  function bookmarkIcon() {
    var ns = "http://www.w3.org/2000/svg", s = document.createElementNS(ns, "svg");
    s.setAttribute("width", "18"); s.setAttribute("height", "18"); s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("fill", "#2974cd"); s.setAttribute("stroke", "#2974cd"); s.setAttribute("stroke-width", "2.2");
    s.setAttribute("stroke-linejoin", "round"); s.setAttribute("aria-hidden", "true");
    var p = document.createElementNS(ns, "path"); p.setAttribute("d", "M6 3h12v18l-6-4-6 4z"); s.appendChild(p);
    return s;
  }
  function setCount(n) {
    count.textContent = "Profiles you saved · " + n + (n === 1 ? " profile" : " profiles");
  }

  function showEmpty() {
    content.textContent = "";
    setCount(0);
    var box = el("div", "empty");
    box.appendChild(el("h2", null, "Nothing saved yet"));
    box.appendChild(el("p", null, "Use the bookmark button on a result card to keep experts you want to come back to."));
    var a = el("a", "btn-link", "Search for help"); a.href = "home.html";
    box.appendChild(a);
    content.appendChild(box);
  }

  function renderCard(p, list) {
    var card = el("article", "card");
    card.setAttribute("aria-labelledby", "name-" + p.id);

    var who = el("div", "who");
    var av = el("div", "avatar", initials(p.full_name)); av.setAttribute("aria-hidden", "true");
    var txt = el("div", "who-text");
    var h = el("h2", null, p.full_name); h.id = "name-" + p.id; h.tabIndex = -1;
    txt.appendChild(h);
    txt.appendChild(el("div", "role", p.job_role || ""));
    if (p.city) txt.appendChild(el("div", "city", p.city));
    var btn = el("button", "unsave"); btn.type = "button";
    btn.setAttribute("aria-pressed", "true");
    btn.setAttribute("aria-label", "Remove " + p.full_name + " from saved");
    btn.title = "Remove from saved";
    btn.appendChild(bookmarkIcon());
    btn.addEventListener("click", function () { remove(p.id, card, list); });
    who.appendChild(av); who.appendChild(txt); who.appendChild(btn);
    card.appendChild(who);

    if (p.expertise) {
      var ex = el("div", "block");
      ex.appendChild(el("h3", null, "Expertise"));
      ex.appendChild(el("p", null, p.expertise));
      card.appendChild(ex);
    }
    if (p.projects && p.projects.length) {
      var pr = el("div", "block");
      pr.appendChild(el("h3", null, "Projects"));
      var ul = el("ul", "chips"); ul.setAttribute("aria-label", "Projects");
      p.projects.forEach(function (t) { ul.appendChild(el("li", null, t)); });
      pr.appendChild(ul);
      card.appendChild(pr);
    }
    return card;
  }

  function remove(id, card, list) {
    writeSaved(readSaved().filter(function (x) { return x !== id; }));
    var next = card.nextElementSibling || card.previousElementSibling;
    card.remove();
    var left = list.children.length;
    if (!left) { showEmpty(); content.querySelector("a").focus(); return; }
    setCount(left);
    next.querySelector("h2").focus(); // keep keyboard focus on the page
  }

  var ids = readSaved();
  if (!ids.length) { showEmpty(); return; }

  fetch("/api/people")
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function (rows) {
      var byId = {};
      (rows || []).forEach(function (p) { byId[p.id] = p; });
      var people = ids.slice().reverse().map(function (id) { return byId[id]; }).filter(Boolean); // newest first
      if (!people.length) { showEmpty(); return; }
      content.textContent = "";
      setCount(people.length);
      var list = el("div", "cards");
      people.forEach(function (p) { list.appendChild(renderCard(p, list)); });
      content.appendChild(list);
    })
    .catch(function () {
      content.textContent = "";
      setCount(ids.length);
      content.appendChild(el("p", "msg", "Your saved profiles can't be loaded right now. Please try again in a moment."));
    });
})();
</script>
</body>
</html>
