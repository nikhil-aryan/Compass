<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compass – Home</title>
<!-- Home tab. No query: home screen (design: Home.dc.html).
     With ?q=...: results view (COM-20 result card, wireframe docs/wireframe-result-card.jpg).
     Data: GET /api/match (api/match.js), shape in docs/data-contract.md.
     If the endpoint fails, the page falls back to data/mock-results.json. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap">
<style>
  :root {
    --blue: #2974cd; --purple: #6d2cbf; --text: #303030; --muted: #6e6e6e;
    --line: #e6e6e6; --lilac: #ede6f7; --lilac-line: #e2d5f2; --sky: #d4e3f5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--text); font-family: 'Open Sans', 'Helvetica Neue', Helvetica, sans-serif; }
  a { color: var(--blue); } a:hover { color: var(--purple); }
  :focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; border-radius: 6px; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 248px; flex-shrink: 0; border-right: 1px solid var(--line); padding: 32px 16px; display: flex; flex-direction: column; justify-content: space-between; }
  .sidebar .label { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin: 0 12px 12px; }
  .sidebar ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .sidebar a { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: var(--text); text-decoration: none; font-size: 15px; }
  .sidebar a[aria-current="page"] { background: #e5eef9; font-weight: 600; }
  .sidebar a:hover { background: #f3f0f8; color: var(--text); }
  .sidebar svg { flex-shrink: 0; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sidebar a[aria-current="page"] svg { stroke: var(--blue); }
  .sidebar .settings { border-top: 1px solid var(--line); padding-top: 16px; }

  main { flex: 1; min-width: 0; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 28px; }
  .btn { height: 44px; padding: 0 20px; border: none; border-radius: 10px; background: var(--sky); color: var(--text); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 150ms ease; }
  .btn:hover { transform: scale(1.05); }

  /* Home view */
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; padding: 24px 0 8vh; }
  .hero h1 { margin: 0; width: 100%; max-width: 520px; }
  .hero h1 img { width: 100%; height: auto; display: block; }
  .hero-search { width: 100%; max-width: 760px; display: flex; align-items: center; gap: 8px; min-height: 60px; padding: 8px 8px 8px 20px; border: 1px solid var(--muted); border-radius: 16px; background: #fff; box-shadow: 0 6px 24px rgba(48,48,48,.08); }
  .hero-search svg { flex-shrink: 0; }
  .hero-search input, .search input { flex: 1; min-width: 0; height: 44px; border: none; background: transparent; font: inherit; font-size: 16px; color: var(--text); }
  .hero-search input::placeholder, .search input::placeholder { color: var(--muted); opacity: 1; }
  .hero-search input:focus, .search input:focus { outline: none; }
  .hero-search:focus-within, .search:focus-within { outline: 3px solid var(--purple); outline-offset: 2px; }
  .hint { margin: -24px 0 0; font-size: 14px; color: var(--muted); text-align: center; }

  /* Results view */
  .top { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .top a { display: inline-flex; border-radius: 6px; }
  .top img { height: 34px; display: block; }
  .search { flex: 1; min-width: 260px; display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 16px; border: 1px solid #303030; border-radius: 14px; }

  .heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  .heading h1 { margin: 0; font-family: 'Poppins', 'Open Sans', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600; overflow-wrap: anywhere; }
  .heading p { margin: 0; font-size: 14px; color: var(--muted); }

  /* Knowledge base first: the document belongs to the problem type, shown once above the experts */
  .doc { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 14px; background: linear-gradient(90deg, #eef4fc, #f3edfb); border: 1px solid var(--lilac-line); }
  .doc .icon { width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; }
  .doc .txt { flex: 1; min-width: 0; }
  .doc .kicker { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--purple); }
  .doc .name { margin: 2px 0 0; font-size: 15px; font-weight: 600; }
  .doc .btn-link { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 10px; background: var(--purple); color: #fff; font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; }
   .card a.btn-link { align-self: flex-start; margin: 4px 0; font-weight: 600; }
  .doc .btn-link:hover { background: #5a22a0; color: #fff; }
  .doc.empty { background: #f7f7f7; border-color: var(--line); }
  .doc.empty .kicker { color: var(--muted); }

  .cards { display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch; }
  .card { flex: 1 1 300px; min-width: 0; max-width: 420px; padding: 20px; border: 1px solid var(--lilac-line); border-radius: 16px; background: #fff; box-shadow: 0 6px 24px rgba(48,48,48,.07); display: flex; flex-direction: column; gap: 16px; }
  .card-top { display: flex; justify-content: space-between; align-items: center; }
  .rank { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--purple); color: #fff; font-size: 12px; font-weight: 700; }
  .pct { font-size: 13px; font-weight: 600; color: var(--muted); }
  .who { display: flex; align-items: center; gap: 14px; }
  .avatar { width: 64px; height: 64px; flex-shrink: 0; border-radius: 50%; background: var(--lilac); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--purple); display: flex; align-items: center; justify-content: center; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 20px; color: var(--purple); }
  .who h2 { margin: 0; font-family: 'Poppins', 'Open Sans', sans-serif; font-size: 18px; line-height: 26px; font-weight: 600; }
  .role { font-size: 14px; font-weight: 600; color: var(--purple); }
  .city { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }

  .why { padding: 12px 14px; border-radius: 10px; background: #eef4fc; border-left: 4px solid var(--blue); }
  .why h3, .block h3 { margin: 0 0 4px; font-family: 'Poppins', 'Open Sans', sans-serif; font-size: 14px; font-weight: 600; }
  .why p { margin: 0; font-size: 14px; line-height: 21px; }
  .block p { margin: 0; font-size: 14px; line-height: 22px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips li { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: var(--lilac); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .chips li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--purple); }
  .chips.skills li { background: #fff; border: 1px solid var(--lilac-line); color: var(--purple); }
  .chips.skills li::before { display: none; }

  .card-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
  .fb { display: flex; gap: 8px; }
  .icon-btn { width: 40px; height: 40px; padding: 0; border: none; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn.up { background: #e3edf9; } .icon-btn.down { background: #ece2f7; } .icon-btn.save { background: #e6e6e6; }
  .icon-btn[aria-pressed="true"].up { background: var(--blue); } .icon-btn[aria-pressed="true"].up svg { stroke: #fff; }
  .icon-btn[aria-pressed="true"].down { background: var(--purple); } .icon-btn[aria-pressed="true"].down svg { stroke: #fff; }
  .icon-btn[aria-pressed="true"].save { background: #303030; } .icon-btn[aria-pressed="true"].save svg { stroke: #fff; }
  .slot-hint { font-size: 13px; font-weight: 600; color: var(--muted); text-align: right; }
  .slot-hint.free { color: #1e6b3a; }

  /* COM-47: Request meeting button and demo dialog */
  .req-btn { width: 100%; height: 44px; border: 2px solid var(--purple); border-radius: 10px; background: var(--purple); color: #fff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 150ms ease; }
  .req-btn:hover { background: #5a22a0; border-color: #5a22a0; }
  .req-btn.later { background: #fff; color: var(--purple); }
  .req-btn.later:hover { background: var(--lilac); }
  dialog#req-dialog { width: calc(100% - 32px); max-width: 480px; padding: 0; border: none; border-radius: 16px; color: var(--text); box-shadow: 0 16px 48px rgba(48,48,48,.25); }
  dialog#req-dialog::backdrop { background: rgba(48,48,48,.45); }
  .dlg-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .dlg-body h2 { margin: 0; font-family: 'Poppins', 'Open Sans', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; }
  .dlg-body h2:focus { outline: none; }
  .dlg-body p { margin: 0; font-size: 14px; line-height: 22px; }
  .demo-note { padding: 12px 14px; border-radius: 10px; background: #fff6e5; border: 1px solid #f0d9a8; font-weight: 600; }
  .dlg-body fieldset { margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px; }
  .dlg-body legend { padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
  .slot-opt { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border: 1px solid var(--lilac-line); border-radius: 10px; font-size: 15px; cursor: pointer; }
  .slot-opt:has(input:checked) { background: var(--lilac); border-color: var(--purple); }
  .slot-opt input { width: 18px; height: 18px; accent-color: var(--purple); }
  .dlg-body label.field { font-size: 14px; font-weight: 700; display: flex; flex-direction: column; gap: 6px; }
  .dlg-body textarea { font: inherit; font-weight: 400; font-size: 14px; min-height: 72px; padding: 10px 12px; border: 1px solid var(--muted); border-radius: 10px; resize: vertical; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
  .dlg-actions .btn { padding: 0 22px; }
  .dlg-actions .primary { background: var(--purple); color: #fff; }
  .dlg-actions .primary:hover { background: #5a22a0; }
  .dlg-actions .secondary { background: #fff; border: 1px solid var(--lilac-line); color: var(--purple); }

  #more { display: flex; flex-direction: column; align-items: flex-start; gap: 24px; }
  .more-btn { background: #fff; border: 1px solid var(--lilac-line); color: var(--purple); }
  .notice { padding: 16px 20px; border-radius: 12px; background: #fff6e5; border: 1px solid #f0d9a8; font-size: 14px; }
  .source { margin: 0; font-size: 12px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .btn, .req-btn { transition: none; } }
  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    .sidebar { width: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 12px 16px; }
    .sidebar .label, .sidebar .settings-link { display: none; }
    .sidebar .settings { border-top: none; padding-top: 4px; }
    .sidebar ul { flex-direction: row; flex-wrap: wrap; }
    main { padding: 20px 16px 40px; }
    .hero { justify-content: flex-start; padding-top: 12vh; }
    .hero-search { padding-left: 14px; }
    .doc { flex-wrap: wrap; }
    .doc .txt { flex: 1 1 180px; }
    .doc .btn-link { width: 100%; justify-content: center; }
    .card { max-width: none; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" aria-label="Main">
    <div>
      <p class="label">MENU</p>
      <ul>
        <li><a href="home.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>Home</a></li>
        <li><a href="people.html"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"></path><path d="M16 4a4 4 0 0 1 0 8"></path><path d="M22 21c0-3-1.8-5.6-4.5-6.6"></path></svg>People</a></li>
        <li><a href="saved.html"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Saved</a></li>
      </ul>
    </div>
    <ul class="settings"><li class="settings-link"><a href="#"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>Settings</a></li>
      <li><a href="login.html" class="account"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="10" r="3"></circle><path d="M6.2 18.4a7 7 0 0 1 11.6 0"></path></svg><span>Sign in</span></a></li>
    </ul>
  </nav>

  <main>
    <!-- Home view (no query) -->
    <section id="home-view" class="hero">
      <h1><img src="../assets/compass-logo.svg" alt="Compass"></h1>
      <form class="hero-search" role="search" action="home.html" method="get">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6e6e6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <label for="q-home" class="sr-only">Describe your problem</label>
        <input id="q-home" name="q" type="search" required placeholder="Tell me your problem or what you need help with" aria-describedby="hint">
        <button class="btn" type="submit">Search</button>
      </form>
      <p id="hint" class="hint">We check the knowledge base first, then suggest the three best-matched colleagues.</p>
    </section>

    <!-- Results view (?q=...) -->
    <div id="results-view" hidden style="display:flex;flex-direction:column;gap:28px">
      <div class="top">
        <a href="home.html"><img src="../assets/compass-logo.svg" alt="Compass home"></a>
        <form class="search" role="search" action="home.html" method="get">
          <label for="q" class="sr-only">Describe your problem</label>
          <input id="q" name="q" type="search" required placeholder="Tell me your problem or what you need help with">
          <button class="btn" type="submit">Search</button>
        </form>
      </div>

      <section aria-labelledby="results-heading" style="display:flex;flex-direction:column;gap:20px">
        <div class="heading">
          <h1 id="results-heading">Results</h1>
          <p>Ranked by match probability</p>
        </div>
        <div id="doc"></div>
        <div id="cards" class="cards" aria-live="polite"><p>Loading matches…</p></div>
        <div id="more" hidden>
          <button id="more-btn" class="btn more-btn" type="button" aria-expanded="false" aria-controls="more-cards">See more</button>
          <div id="more-cards" class="cards" hidden></div>
        </div>
        <p id="source" class="source"></p>
      </section>
    </div>
  </main>
</div>

<!-- COM-47: demo-only meeting request. Nothing is sent anywhere. -->
<dialog id="req-dialog" aria-labelledby="req-title">
  <div class="dlg-body" id="req-body"></div>
</dialog>

<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var query = (params.get("q") || "").trim();

  // No query: stay on the home view.
  if (!query) return;

  document.getElementById("home-view").hidden = true;
  document.getElementById("results-view").hidden = false;
  document.getElementById("q").value = query;
  document.getElementById("results-heading").textContent = "Results for “" + query + "”";
  document.title = "Results for “" + query + "” – Compass";

  // 1) matching endpoint -> 2) mock file -> 3) friendly error
  function load() {
    return fetch("/api/match?q=" + encodeURIComponent(query))
      .then(function (r) { if (!r.ok) throw new Error(); return r.json().then(function (d) { return { data: d, mock: false }; }); })
      .catch(function () {
        return fetch("../data/mock-results.json")
          .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
          .then(function (d) { return { data: d, mock: true }; });
      });
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text; // textContent = no HTML injection
    return e;
  }
  function svg(path, color) {
    var ns = "http://www.w3.org/2000/svg", s = document.createElementNS(ns, "svg");
    s.setAttribute("width", "18"); s.setAttribute("height", "18"); s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("fill", "none"); s.setAttribute("stroke", color); s.setAttribute("stroke-width", "2.2");
    s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round"); s.setAttribute("aria-hidden", "true");
    var p = document.createElementNS(ns, "path"); p.setAttribute("d", path); s.appendChild(p);
    return s;
  }
  function initials(name) {
    return (name || "?").split(/\s+/).map(function (w) { return w[0]; }).slice(0, 2).join("").toUpperCase();
  }
  function fmtSlot(iso) {
    var d = new Date(iso);
    return d.toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }
  function chips(items, extraCls, label) {
    var ul = el("ul", "chips" + (extraCls ? " " + extraCls : ""));
    ul.setAttribute("aria-label", label);
    (items || []).forEach(function (t) { ul.appendChild(el("li", null, t)); });
    return ul;
  }
  function toggle(btn) {
    btn.addEventListener("click", function () {
      btn.setAttribute("aria-pressed", String(btn.getAttribute("aria-pressed") !== "true"));
    });
  }

  // COM-57: saved experts live in this browser only (no accounts yet). Read by saved.html.
  var SAVED_KEY = "compass.saved";
  function readSaved() {
    try { var v = JSON.parse(localStorage.getItem(SAVED_KEY) || "[]"); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  function writeSaved(ids) {
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(ids)); } catch (e) { /* storage blocked: ignore */ }
  }

  // COM-37: document for the problem type (knowledge base first), with fallback
  function renderDoc(pt) {
    var box = document.getElementById("doc");
    box.textContent = "";
    var wrap = el("div", "doc");
    var icon = el("div", "icon");
    icon.appendChild(svg("M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h5", "#6d2cbf"));
    var txt = el("div", "txt");
    if (pt && pt.fileUrl) {
      txt.appendChild(el("p", "kicker", "Try this first"));
      txt.appendChild(el("p", "name", pt.fileName || "Related document"));
      wrap.appendChild(icon); wrap.appendChild(txt);
      var a = el("a", "btn-link", "Open document");
      a.href = pt.fileUrl; a.target = "_blank"; a.rel = "noopener";
      a.setAttribute("aria-label", "Open document: " + (pt.fileName || "related document") + " (opens in a new tab)");
      wrap.appendChild(a);
    } else {
      wrap.className = "doc empty";
      txt.appendChild(el("p", "kicker", "Knowledge base"));
      txt.appendChild(el("p", "name", "No document for this problem yet. Ask one of the experts below."));
      wrap.appendChild(icon); wrap.appendChild(txt);
    }
    box.appendChild(wrap);
  }

  // COM-35 + COM-36: one card per expert
     // email lookup: /api/match has no email, /api/people does (same ids)
  var emailsReady = fetch("/api/people")
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (rows) { var m = {}; rows.forEach(function (p) { m[p.id] = p.email; }); return m; })
    .catch(function () { return {}; });
  function renderCard(x) {
    var card = el("article", "card");
    card.setAttribute("aria-labelledby", "name-" + x.expertId);

    var top = el("div", "card-top");
    top.appendChild(el("span", "rank", "#" + x.rank));
    top.appendChild(el("span", "pct", (x.matchPercent != null ? x.matchPercent + "% match" : "")));
    card.appendChild(top);

    var who = el("div", "who");
    var av = el("div", "avatar", initials(x.name)); av.setAttribute("aria-hidden", "true");
    var info = el("div");
    var h = el("h2", null, x.name); h.id = "name-" + x.expertId;
    info.appendChild(h);
    info.appendChild(el("div", "role", x.role || ""));
    if (x.city) info.appendChild(el("div", "city", x.city));
    who.appendChild(av); who.appendChild(info);
    card.appendChild(who);

    if (x.skillTags && x.skillTags.length) card.appendChild(chips(x.skillTags.slice(0, 3), "skills", "Skills"));

    var why = el("div", "why");
    why.appendChild(el("h3", null, "Why this person"));
    why.appendChild(el("p", null, x.reason || "Matched on skills related to your problem."));
    card.appendChild(why);

    if (x.expertise) {
      var ex = el("div", "block");
      ex.appendChild(el("h3", null, "Expertise"));
      ex.appendChild(el("p", null, x.expertise));
      card.appendChild(ex);
    }
    if (x.projects && x.projects.length) {
      var pr = el("div", "block");
      pr.appendChild(el("h3", null, "Projects"));
      pr.appendChild(chips(x.projects.slice(0, 2), null, "Projects"));
      card.appendChild(pr);
    }

    // COM-47: Request meeting (demo only, see openRequest below)
    var hasSlots = !!(x.slots && x.slots.length);
    var mail = el("a", "btn-link", "Email"); mail.hidden = true;
    emailsReady.then(function (m) {
      if (m[x.expertId]) { mail.href = "mailto:" + m[x.expertId]; mail.hidden = false; mail.setAttribute("aria-label", "Email " + x.name); }
    });
    card.appendChild(mail);
    var req = el("button", "req-btn" + (hasSlots ? "" : " later"), hasSlots ? "Request meeting" : "Request for later");
    req.type = "button";
    req.setAttribute("aria-label", (hasSlots ? "Request meeting with " : "Request for later with ") + x.name);
    req.addEventListener("click", function () { openRequest(x, req); });
    card.appendChild(req);

    var foot = el("div", "card-foot");
    var fb = el("div", "fb"); fb.setAttribute("role", "group"); fb.setAttribute("aria-label", "Does this person match your problem?");
    var up = el("button", "icon-btn up"); up.type = "button"; up.setAttribute("aria-pressed", "false"); up.setAttribute("aria-label", "Good match: " + x.name);
    up.appendChild(svg("M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3", "#2974cd"));
    var down = el("button", "icon-btn down"); down.type = "button"; down.setAttribute("aria-pressed", "false"); down.setAttribute("aria-label", "Wrong match: " + x.name);
    down.appendChild(svg("M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17", "#6d2cbf"));
    var save = el("button", "icon-btn save"); save.type = "button"; save.setAttribute("aria-label", "Save " + x.name);
    save.setAttribute("aria-pressed", String(readSaved().indexOf(x.expertId) !== -1)); // stays saved after a reload
    save.title = "Save to your Saved tab";
    save.appendChild(svg("m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z", "#303030"));
    [up, down].forEach(toggle);
    save.addEventListener("click", function () {
      var on = save.getAttribute("aria-pressed") !== "true";
      save.setAttribute("aria-pressed", String(on));
      var ids = readSaved().filter(function (id) { return id !== x.expertId; });
      if (on) ids.push(x.expertId);
      writeSaved(ids);
    });
    up.addEventListener("click", function () { if (up.getAttribute("aria-pressed") === "true") down.setAttribute("aria-pressed", "false"); });
    down.addEventListener("click", function () { if (down.getAttribute("aria-pressed") === "true") up.setAttribute("aria-pressed", "false"); });
    fb.appendChild(up); fb.appendChild(down); fb.appendChild(save);
    foot.appendChild(fb);

    // Availability hint next to the feedback buttons; the Request button is above (COM-47).
    var hint = (x.slots && x.slots.length)
      ? el("span", "slot-hint free", "Free " + fmtSlot(x.slots[0]))
      : el("span", "slot-hint", "No free slot soon");
    foot.appendChild(hint);
    card.appendChild(foot);
    return card;
  }

  // COM-47: Request meeting dialog. Demo only: no request, email, invitation or calendar call is made.
  var dlg = document.getElementById("req-dialog");
  var dlgBody = document.getElementById("req-body");
  var lastTrigger = null;

  function closeDialog() { if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); }
  dlg.addEventListener("close", function () { if (lastTrigger) lastTrigger.focus(); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) closeDialog(); }); // click on backdrop

  function openRequest(x, trigger) {
    lastTrigger = trigger;
    var slots = (x.slots || []).slice(0, 2);
    dlgBody.textContent = "";

    var title = el("h2", null, "Request a meeting with " + x.name);
    title.id = "req-title";
    dlgBody.appendChild(title);
    dlgBody.appendChild(el("p", "demo-note", "Demo only: no request will be sent. No invitation or email is created and no calendar is used."));

    var chosen = slots[0] || null;
    if (slots.length) {
      var fs = el("fieldset");
      fs.appendChild(el("legend", null, "Choose a time"));
      slots.forEach(function (iso, i) {
        var lab = el("label", "slot-opt");
        var r = el("input"); r.type = "radio"; r.name = "req-slot"; r.value = iso; r.checked = i === 0;
        r.addEventListener("change", function () { chosen = iso; });
        lab.appendChild(r); lab.appendChild(el("span", null, fmtSlot(iso)));
        fs.appendChild(lab);
      });
      dlgBody.appendChild(fs);
    } else {
      dlgBody.appendChild(el("p", null, x.name + " has no free slot in the next two weeks. You can still request a meeting without a fixed time."));
    }

    var note = el("label", "field", "Note for " + x.name + " (optional)");
    var ta = el("textarea"); ta.maxLength = 300; ta.rows = 3;
    note.appendChild(ta);
    dlgBody.appendChild(note);

    var actions = el("div", "dlg-actions");
    var cancel = el("button", "btn secondary", "Cancel"); cancel.type = "button";
    cancel.addEventListener("click", closeDialog);
    var send = el("button", "btn primary", "Send request"); send.type = "button";
    send.addEventListener("click", function () { showConfirmation(x, chosen); });
    actions.appendChild(cancel); actions.appendChild(send);
    dlgBody.appendChild(actions);

    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  }

  function showConfirmation(x, iso) {
    dlgBody.textContent = "";
    var title = el("h2", null, "Demo only: request not sent");
    title.id = "req-title"; title.tabIndex = -1;
    dlgBody.appendChild(title);
    dlgBody.appendChild(el("p", "demo-note", "Nothing was sent. No email, invitation or calendar entry was created."));
    dlgBody.appendChild(el("p", null, "In the real product, " + x.name + " would receive your request" + (iso ? " for " + fmtSlot(iso) : " without a fixed time") + " and could accept or decline it."));
    var actions = el("div", "dlg-actions");
    var close = el("button", "btn primary", "Close"); close.type = "button";
    close.addEventListener("click", closeDialog);
    actions.appendChild(close);
    dlgBody.appendChild(actions);
    title.focus();
  }

  // Ranked matches after the top 3, behind "See more"
  function renderMore(rest) {
    if (!rest.length) return;
    var wrap = document.getElementById("more");
    var btn = document.getElementById("more-btn");
    var list = document.getElementById("more-cards");
    rest.forEach(function (x) { list.appendChild(renderCard(x)); });
    var label = "See " + rest.length + " more " + (rest.length === 1 ? "match" : "matches");
    btn.textContent = label;
    btn.addEventListener("click", function () {
      var open = btn.getAttribute("aria-expanded") !== "true";
      btn.setAttribute("aria-expanded", String(open));
      list.hidden = !open;
      btn.textContent = open ? "Show fewer" : label;
    });
    wrap.hidden = false;
  }

  load().then(function (res) {
    var d = res.data || {};
    renderDoc(d.problemType);
    var cards = document.getElementById("cards");
    cards.textContent = "";
    var experts = (d.experts || []).slice().sort(function (a, b) { return a.rank - b.rank; });
    if (!experts.length || d.state === "no_match") {
      cards.appendChild(el("p", "notice", "We couldn't find a matching expert for this problem yet. Try describing it differently or pick a category."));
    } else {
      if (d.state === "no_availability") {
        cards.parentNode.insertBefore(el("p", "notice", "None of the top matches has a 2-hour slot in the next two weeks. You can still contact them, or see more matches below."), cards);
      }
      experts.slice(0, 3).forEach(function (x) { cards.appendChild(renderCard(x)); });
      renderMore(experts.slice(3));
    }
    document.getElementById("source").textContent = res.mock ? "Showing demo data (matching service not reachable)." : "";
  }).catch(function () {
    document.getElementById("doc").textContent = "";
    var c = document.getElementById("cards");
    c.textContent = "";
    c.appendChild(el("p", "notice", "Results can't be loaded right now. Please try again in a moment."));
  });
})();
</script>
</body>
</html>
