<style>
  /* Compass design tokens (from the Compass guidelines) */
  :root {
    --white: #ffffff;
    --grey-light: #b4b4b4;   /* borders, dividers, disabled states */
    --grey-mid: #6e6e6e;     /* secondary text, icons */
    --charcoal: #303030;     /* body text, dark panels */
    --blue: #2974cd;         /* accent, gradient start */
    --purple: #6d2cbf;       /* accent, gradient end */
    --blue-light: #d4e3f5;   /* light-blue button fill */
    --purple-light: #e2d5f2; /* light-purple button fill */
    --purple-pressed: #d3c0ec;

    --bg: var(--white);
    --text: var(--charcoal);
    --muted: var(--grey-mid);
    --field-bg: var(--white);
    --field-border: var(--grey-light);
    --logo-start: var(--blue);
    --logo-end: var(--purple);
    --font: "Open Sans", "Helvetica Neue", Helvetica, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 48px 16px;
  }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  h1 { margin: 0; width: 100%; max-width: 520px; }
  .logo { display: block; width: 100%; height: auto; }
  .stop-start { stop-color: var(--logo-start); }
  .stop-end   { stop-color: var(--logo-end); }

  .search { width: 100%; max-width: 760px; }
  .search-field {
    display: flex; align-items: center; gap: 8px;
    min-height: 60px; padding: 8px 8px 8px 20px;
    border: 1px solid var(--field-border);
    border-radius: 16px;
    background: var(--field-bg);
    cursor: not-allowed;
  }
  .search-field svg { flex-shrink: 0; }
  .search-field input {
    flex: 1; min-width: 0; height: 44px;
    border: none; background: transparent;
    font: 16px var(--font); color: var(--text);
    cursor: not-allowed;
  }
  .search-field input::placeholder { color: var(--muted); opacity: 1; }
  .search-field button {
    flex-shrink: 0; height: 44px; padding: 0 20px;
    border: none; border-radius: 10px;
    background: var(--blue-light); color: var(--charcoal);
    font: 600 15px var(--font);
    opacity: .45;               /* disabled state per button spec */
    cursor: not-allowed;
  }
  .search-note { margin: 10px 0 0; text-align: center; font-size: 13px; color: var(--muted); }

  /* Light purple button (Buttons spec) */
  .btn-purple {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 0 20px;
    border-radius: 10px;
    background: var(--purple-light); color: var(--charcoal);
    font: 600 15px var(--font); text-decoration: none;
    transition: transform 150ms ease;
  }
  .btn-purple:hover { transform: scale(1.05); color: var(--charcoal); }
  .btn-purple:active { background: var(--purple-pressed); }
  .btn-purple:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .btn-purple { transition: none; } }

  /* Dark mode: white logo on #303030, per "Logo on backgrounds" */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--charcoal);
      --text: var(--white);
      --muted: #c8c8c8;
      --field-bg: #3a3a3a;
      --field-border: var(--grey-mid);
      --logo-start: var(--white);
      --logo-end: var(--white);
    }
  }

  /* Anton: toggle button and message */
  .anton { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  button.btn-purple { border: none; cursor: pointer; }
  .anton-message { margin: 0; padding: 16px 24px; border: 1px solid var(--field-border); border-radius: 16px; font-size: 18px; font-weight: 600; }
</style>
</head>
